<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지하안전 관리시스템 v17.0</title>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{
  --bg:#0b101b; --sur:#111827; --s2:#1f2937; --bor:#374151;
  --acc:#00c6ff; --red:#ef4444; --yel:#f59e0b; --txt:#f1f5f9;
  --gen:#a855f7; --pri:#3b82f6; --urg:#ef4444;
  --hdr:52px;   /* 헤더 높이 */
  --tab:44px;   /* 모바일 탭바 높이 */
  --bp:260px;   /* 데스크탑 하단 패널 높이 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;
          background:var(--bg);color:var(--txt);}

/* ══════════ 공통 버튼 ══════════ */
.btn{border:none;border-radius:6px;padding:7px 14px;font-weight:700;
     cursor:pointer;font-size:12px;white-space:nowrap;transition:.15s;}
.btn:active{opacity:.75;}
.ba{background:var(--acc);color:#000;}
.bw{background:var(--yel);color:#000;}
.bs{background:var(--s2);color:var(--txt);border:1px solid var(--bor);}
.br{background:var(--red);color:#fff;}

/* ══════════ 헤더 ══════════ */
header{
  height:var(--hdr);padding:0 12px;
  background:var(--sur);border-bottom:1px solid var(--bor);
  display:flex;align-items:center;gap:8px;z-index:300;flex-shrink:0;
}
header h1{font-size:13px;white-space:nowrap;flex-shrink:0;}

/* 검색바 */
.sw{flex:1;display:flex;align-items:center;gap:5px;
    background:var(--s2);border:1px solid var(--bor);
    border-radius:6px;padding:4px 8px;min-width:0;}
.sw input{background:none;border:none;outline:none;color:var(--txt);
          font-size:12px;width:100%;min-width:0;}
.sw input::placeholder{color:#6b7280;}
.sbtn{background:var(--acc);border:none;border-radius:4px;
      padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;white-space:nowrap;}
.scl{background:none;border:none;color:#9ca3af;cursor:pointer;
     font-size:16px;padding:0 3px;line-height:1;}
.scl:hover{color:var(--red);}

/* 헤더 우측 버튼들 */
.hr{display:flex;gap:6px;align-items:center;flex-shrink:0;}

/* 검색 결과 드롭다운 */
#sRes{position:fixed;top:var(--hdr);left:50%;transform:translateX(-50%);
      width:min(400px, 92vw);max-height:55vh;overflow-y:auto;
      background:var(--sur);border:1px solid var(--acc);
      border-radius:0 0 10px 10px;z-index:500;display:none;
      box-shadow:0 8px 28px rgba(0,0,0,.7);}
.sri{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:12px;}
.sri:hover,.sri:active{background:var(--s2);}
.sri .sn{font-weight:600;color:var(--acc);}
.sri .sa{color:#9ca3af;font-size:10px;margin-top:2px;}
.sr0{padding:14px;text-align:center;color:#6b7280;font-size:12px;}

/* ══════════ 데스크탑 레이아웃 ══════════ */
.app-body{
  display:flex;flex-direction:column;
  height:calc(100vh - var(--hdr));
  overflow:hidden;
}
.main{display:flex;flex:1;overflow:hidden;position:relative;}

/* 사이드바 (데스크탑만) */
.side{
  width:265px;flex-shrink:0;
  border-right:1px solid var(--bor);
  display:flex;flex-direction:column;
  background:var(--sur);overflow-y:auto;
}
.dz{margin:10px;padding:14px;border:2px dashed var(--bor);border-radius:8px;
    text-align:center;cursor:pointer;font-size:11px;transition:.2s;line-height:1.9;}
.dz:hover,.dz.over{border-color:var(--acc);background:rgba(0,198,255,.05);}
.side-section{margin:0 10px 8px;border-top:1px solid var(--bor);padding-top:8px;}
.side-label{font-size:10px;color:#6b7280;margin-bottom:5px;}
#flist{padding:0 6px 6px;}
.fi{background:var(--s2);margin-bottom:4px;padding:8px 10px;border-radius:6px;
    display:flex;align-items:center;font-size:11px;gap:7px;
    border:1px solid transparent;cursor:default;}
.fi.act{border-color:var(--acc);}
.fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.fn:hover{color:var(--acc);}

/* 지도 */
#map{flex:1;position:relative;background:#1a1a2e;}
#cbadge{position:absolute;top:10px;left:50%;transform:translateX(-50%);
        background:rgba(239,68,68,.92);color:#fff;padding:6px 18px;
        border-radius:20px;font-size:12px;font-weight:700;
        z-index:200;display:none;pointer-events:none;}
#gbadge{position:absolute;top:10px;right:10px;
        background:rgba(17,24,39,.92);border:1px solid var(--acc);
        border-radius:20px;padding:5px 14px;font-size:11px;
        color:var(--acc);display:none;z-index:200;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#gbadge{animation:blink 1.2s infinite;}

/* 범례 */
#leg{position:absolute;bottom:28px;right:10px;
     background:rgba(10,15,26,.88);border:1px solid var(--bor);
     border-radius:8px;padding:10px 14px;z-index:200;font-size:11px;
     backdrop-filter:blur(6px);}
.lt{color:var(--acc);font-weight:700;margin-bottom:8px;font-size:12px;}
.lr{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ld{width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.7);flex-shrink:0;}
.ld.gen{background:var(--gen);}
.ld.pri{background:var(--pri);}
.ld.urg{background:var(--urg);}

/* 마커 */
.mw{position:relative;}
.mc{width:24px;height:24px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.85);color:#fff;
    font-size:9px;font-weight:700;display:flex;align-items:center;
    justify-content:center;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s;}
.mc:hover,.mc:active{transform:scale(1.3);}
.mc.gen{background:var(--gen);}
.mc.pri{background:var(--pri);}
.mc.urg{background:var(--urg);}
.mt{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
    background:rgba(8,14,26,.97);color:#fff;padding:9px 12px;
    border-radius:8px;font-size:11px;min-width:190px;display:none;
    border:1.5px solid var(--acc);z-index:1000;
    pointer-events:none;white-space:nowrap;}
.mt::after{content:'';position:absolute;top:100%;left:50%;
           transform:translateX(-50%);border:6px solid transparent;
           border-top-color:var(--acc);}

/* ══════════ 데스크탑 하단 테이블 패널 ══════════ */
.bp{height:var(--bp);background:var(--sur);
    border-top:2px solid var(--bor);overflow:auto;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:11px;
      min-width:2200px;table-layout:fixed;}
th{position:sticky;top:0;background:#141e30;padding:9px 8px;
   text-align:left;border-bottom:1px solid var(--bor);
   color:var(--acc);z-index:10;}
td{padding:3px 8px;border-bottom:1px solid #1a2840;vertical-align:middle;}
tr:hover td{background:rgba(0,198,255,.04);}
tr.hl td{background:rgba(0,198,255,.1)!important;}
.ce{background:none;border:1px solid transparent;color:#fff;
    width:100%;font-size:11px;outline:none;padding:5px;border-radius:3px;}
.ce:focus{border-color:var(--acc);background:rgba(0,198,255,.08);}
.qa{color:#facc15!important;}
.qf{color:#ef4444!important;}
.qw{color:#9ca3af!important;}

/* ══════════ 모바일 전용 스타일 ══════════ */
@media (max-width:767px){

  /* 헤더: 2줄 구조 */
  header{
    height:auto;min-height:var(--hdr);
    flex-wrap:wrap;padding:8px 10px;gap:6px;
  }
  header h1{font-size:12px;}
  .sw{flex-basis:100%;order:2;}       /* 검색바 2번째 줄 */
  .hr{order:1;margin-left:auto;}      /* 버튼 1번째 줄 우측 */
  .hr .btn{padding:5px 10px;font-size:11px;}
  /* 헤더가 2줄이면 높이가 달라지므로 JS로 보정 */

  /* 사이드바 → 숨김 (모바일 패널로 대체) */
  .side{display:none !important;}

  /* 앱 바디 */
  .app-body{height:calc(100dvh - 96px);}  /* 2줄 헤더 + 탭바 */

  /* 지도: 화면 절반 이상 */
  #map{height:52vh;flex:none;}

  /* 범례: 더 작게 */
  #leg{padding:7px 10px;bottom:10px;right:8px;}
  .lt{font-size:11px;margin-bottom:5px;}
  .lr{margin-bottom:3px;}
  .ld{width:14px;height:14px;}
  #leg span{font-size:10px;}

  /* 하단 패널: 탭 구조 */
  .bp{height:calc(48vh - var(--tab));flex:1;}
  table{min-width:1400px;font-size:10px;}
  th,td{padding:4px 5px;}
  .ce{font-size:10px;padding:3px;}

  /* 모바일 탭바 */
  #mobileTab{
    display:flex;height:var(--tab);
    background:var(--sur);border-top:1px solid var(--bor);
    flex-shrink:0;
  }
  .tab-btn{
    flex:1;background:none;border:none;color:#9ca3af;
    font-size:11px;font-weight:500;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;border-top:2px solid transparent;
    transition:.15s;
  }
  .tab-btn.on{color:var(--acc);border-top-color:var(--acc);}
  .tab-btn svg{width:18px;height:18px;}

  /* 모바일 패널들 */
  #mPanel{display:flex;flex-direction:column;overflow:hidden;flex:1;}
  #panelFiles{display:none;background:var(--sur);overflow-y:auto;flex:1;padding:10px;}
  #panelTable{display:flex;flex-direction:column;flex:1;overflow:hidden;}

  /* 모바일 파일패널 내 카드 */
  .m-fi{background:var(--s2);border-radius:8px;padding:10px 12px;
        margin-bottom:6px;border:1px solid transparent;}
  .m-fi.act{border-color:var(--acc);}
  .m-fi .mfn{font-size:12px;font-weight:500;margin-bottom:4px;}
  .m-fi .mfmeta{font-size:10px;color:#9ca3af;display:flex;gap:8px;flex-wrap:wrap;}

  /* 모바일 파일패널 상단 업로드 버튼 */
  .m-upload-row{display:flex;gap:6px;margin-bottom:10px;}
  .m-upload-row .btn{flex:1;font-size:11px;padding:8px;}

  /* 모바일에서 검색 결과 */
  #sRes{width:96vw;left:2vw;transform:none;}
}

/* 데스크탑에서 모바일 전용 요소 숨김 */
@media (min-width:768px){
  #mobileTab{display:none;}
  #mPanel{display:contents;}     /* 자식 요소가 그냥 flow에 참여 */
  #panelFiles{display:none;}
  #panelTable{display:contents;}
}

/* upload progress */
#upProg{font-size:11px;color:var(--acc);padding:4px 0;display:none;}
</style>
</head>
<body>

<!-- ══════ 헤더 ══════ -->
<header>
  <h1>🗺 지하안전 관리 <span style="font-weight:300;opacity:.5">v17</span></h1>
  <div class="hr">
    <button class="btn bw" id="cbtn" onclick="toggleClick()">📍 추가</button>
    <button class="btn bs"  onclick="saveToFB()">☁</button>
    <button class="btn ba"  onclick="exportXlsx()">📊</button>
  </div>
  <div class="sw" id="sw">
    <span style="color:#6b7280;font-size:13px">🔍</span>
    <input id="sInp" type="text" placeholder="장소·지번·도로명 검색"
           onkeydown="if(event.key==='Enter')doSearch()"
           oninput="if(!this.value)clearSearch()">
    <button class="sbtn" onclick="doSearch()">검색</button>
    <button class="scl"  onclick="clearSearch()">✕</button>
  </div>
</header>

<!-- 검색 결과 -->
<div id="sRes"></div>

<!-- ══════ 본문 ══════ -->
<div class="app-body">
  <div class="main">

    <!-- 사이드바 (데스크탑) -->
    <div class="side">
      <!-- Storage 업로드 -->
      <div style="margin:10px 10px 0;display:flex;gap:5px;">
        <button onclick="document.getElementById('fbUp').click()"
                class="btn bs" style="flex:1;font-size:11px;padding:6px;">
          ☁ FB 엑셀 업로드
        </button>
      </div>
      <input type="file" id="fbUp" style="display:none" accept=".xlsx"
             onchange="uploadToStorage(this.files[0]);this.value=''">
      <div id="upProg" style="margin:3px 10px 0;"></div>

      <!-- 로컬 업로드 -->
      <div class="dz" id="dz"
           onclick="document.getElementById('fi').click()"
           ondragover="event.preventDefault();this.classList.add('over')"
           ondragleave="this.classList.remove('over')"
           ondrop="this.classList.remove('over');handleDrop(event)">
        📁 엑셀 드래그 또는 클릭<br>
        <span style="color:#6b7280;font-size:10px">RawData 시트 · 6행부터</span>
      </div>
      <input type="file" id="fi" style="display:none" accept=".xlsx"
             onchange="readExcel(this.files[0]);this.value=''">

      <!-- 로드된 파일 목록 -->
      <div class="side-section">
        <div class="side-label">📂 불러온 파일</div>
        <div id="flist"></div>
      </div>

      <!-- Firebase 파일 목록 -->
      <div class="side-section">
        <div class="side-label">☁ Firebase 저장된 파일</div>
        <button onclick="loadFromFB()" class="btn bs"
                style="width:100%;font-size:11px;padding:6px;margin-bottom:4px;">
          🔄 FB 목록 새로고침
        </button>
        <div id="fbList" style="font-size:11px;color:#9ca3af;text-align:center;padding:4px 0;">
          위 버튼으로 불러오세요
        </div>
      </div>
    </div>

    <!-- 지도 -->
    <div id="map">
      <div id="cbadge">📍 지도를 클릭하여 새 지점 추가</div>
      <div id="gbadge">🔄 변환 중 <span id="gcnt">0</span>건</div>
      <div id="leg">
        <div class="lt">범 례</div>
        <div class="lr"><div class="ld gen"></div><span>일반</span></div>
        <div class="lr"><div class="ld pri"></div><span>우선</span></div>
        <div class="lr"><div class="ld urg"></div><span>긴급</span></div>
      </div>
    </div>
  </div><!-- /.main -->

  <!-- ══════ 패널 래퍼 (모바일: 탭 전환 / 데스크탑: 테이블만) ══════ -->
  <div id="mPanel">

    <!-- 파일 패널 (모바일 탭 1) -->
    <div id="panelFiles">
      <div class="m-upload-row">
        <button class="btn bs" onclick="document.getElementById('fi2').click()">
          📁 로컬 엑셀
        </button>
        <button class="btn bs" onclick="document.getElementById('fbUp2').click()">
          ☁ FB 업로드
        </button>
        <button class="btn bs" onclick="loadFromFB()">🔄 FB 목록</button>
      </div>
      <input type="file" id="fi2" style="display:none" accept=".xlsx"
             onchange="readExcel(this.files[0]);this.value=''">
      <input type="file" id="fbUp2" style="display:none" accept=".xlsx"
             onchange="uploadToStorage(this.files[0]);this.value=''">
      <!-- 로드된 파일 -->
      <div style="font-size:11px;color:#6b7280;margin-bottom:5px;">📂 불러온 파일</div>
      <div id="mFlist"></div>
      <!-- FB 파일 -->
      <div style="font-size:11px;color:#6b7280;margin:8px 0 5px;">☁ Firebase 파일</div>
      <div id="mFbList" style="font-size:11px;color:#9ca3af;text-align:center;padding:4px 0;">
        🔄 FB 목록 버튼을 눌러주세요
      </div>
    </div>

    <!-- 테이블 패널 (모바일 탭 2 / 데스크탑 하단) -->
    <div id="panelTable">
      <div class="bp">
        <table>
          <thead><tr>
            <th width="45">순번</th>
            <th width="90">조사측선</th>
            <th width="110">조사번호</th>
            <th width="60">침하</th><th width="65">균열</th><th width="60">습윤</th>
            <th width="55">노후도</th><th width="95">침하이력</th>
            <th width="40">침하점</th><th width="40">균열점</th><th width="40">습윤점</th>
            <th width="40">노후점</th><th width="40">보수</th>
            <th width="40">평가점</th><th width="60">등급</th>
            <th width="100">조사의견</th>
            <th width="200">인접지번주소 <span style="color:#6b7280;font-weight:400">(수정→마커)</span></th>
            <th width="150">부가정보1</th>
            <th width="170">부가정보2</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /#mPanel -->

  <!-- 모바일 탭바 -->
  <div id="mobileTab">
    <button class="tab-btn" id="tab0" onclick="switchTab(0)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      지도
    </button>
    <button class="tab-btn" id="tab1" onclick="switchTab(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
      </svg>
      파일
    </button>
    <button class="tab-btn" id="tab2" onclick="switchTab(2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M3 15h18M9 3v18"/>
      </svg>
      데이터
    </button>
    <button class="tab-btn" id="tab3" onclick="switchTab(3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      검색
    </button>
  </div>
</div><!-- /.app-body -->

<script>
/* ══════════════════════════════════════════════════
   모바일 탭 전환
══════════════════════════════════════════════════ */
let currentTab = 0;
function switchTab(n) {
  const isMobile = window.innerWidth < 768;
  if (!isMobile) return;

  currentTab = n;
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('on', i===n));

  const map      = document.getElementById('map');
  const pFiles   = document.getElementById('panelFiles');
  const pTable   = document.getElementById('panelTable');
  const sInpWrap = document.getElementById('sw');

  // 탭 0: 지도
  // 탭 1: 파일 목록
  // 탭 2: 데이터 테이블
  // 탭 3: 검색 (검색창 포커스)
  map.style.display    = (n===0) ? 'block' : 'none';
  pFiles.style.display = (n===1) ? 'flex'  : 'none';
  pTable.style.display = (n===2) ? 'flex'  : 'none';

  if (n===3) {
    map.style.display = 'none';
    pFiles.style.display = 'none';
    pTable.style.display = 'none';
    setTimeout(() => document.getElementById('sInp').focus(), 100);
  }
}

// 초기 탭 설정 (모바일: 지도탭, 데스크탑: 무관)
function initTabs() {
  if (window.innerWidth < 768) {
    document.getElementById('tab0').classList.add('on');
    switchTab(0);
  }
}

/* ══════════════════════════════════════════════════
   카카오 REST API 지오코딩·검색 (도메인 무관)
══════════════════════════════════════════════════ */
async function geocodeAddr(addr) {
  if (!addr) return null;
  const H = { 'Authorization': `KakaoAK ${KAKAO_REST}` };
  try {
    const r = await fetch(
      `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(addr)}&size=1`,
      { headers:H });
    const d = await r.json();
    if (d.documents?.length > 0)
      return { lat:parseFloat(d.documents[0].y), lng:parseFloat(d.documents[0].x) };
  } catch(e){}
  try {
    const r = await fetch(
      `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(addr)}&size=1`,
      { headers:H });
    const d = await r.json();
    if (d.documents?.length > 0)
      return { lat:parseFloat(d.documents[0].y), lng:parseFloat(d.documents[0].x) };
  } catch(e){}
  return null;
}

async function searchPlaces(q) {
  if (!q) return [];
  const H = { 'Authorization': `KakaoAK ${KAKAO_REST}` };
  try {
    const r = await fetch(
      `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=8`,
      { headers:H });
    const d = await r.json();
    if (d.documents?.length > 0)
      return d.documents.map(p => ({
        lat:parseFloat(p.y), lng:parseFloat(p.x),
        name:p.place_name,
        addr:p.address_name || p.road_address_name
      }));
  } catch(e){}
  try {
    const r = await fetch(
      `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(q)}&size=8`,
      { headers:H });
    const d = await r.json();
    if (d.documents?.length > 0)
      return d.documents.map(p => ({
        lat:parseFloat(p.y), lng:parseFloat(p.x),
        name:p.address_name,
        addr:p.road_address ? p.road_address.address_name : ''
      }));
  } catch(e){}
  return [];
}

/* ══════════════════════════════════════════════════
   지오코딩 직렬 큐
══════════════════════════════════════════════════ */
async function runGeoQueue() {
  if (!kakaoReady || geoRunning || geoQ.length === 0) return;
  geoRunning = true;
  while (geoQ.length > 0) {
    const { fid, rowIdx } = geoQ.shift();
    updateGBadge();
    const f = files[fid]; if (!f) continue;
    const row = f.rows[rowIdx];
    const res = await geocodeAddr(row.addr);
    if (res) {
      row.lat=res.lat; row.lng=res.lng; row.geoOk=true;
      updateQCell(fid, row._key, true);
      if (f.visible) placeMarker(fid, row._key, row);
    } else {
      row.geoOk=false;
      updateQCell(fid, row._key, false);
    }
    await new Promise(r => setTimeout(r, 300));
  }
  geoRunning = false;
  updateGBadge();
}
function updateGBadge() {
  const n = geoQ.length;
  document.getElementById('gcnt').textContent = n;
  document.getElementById('gbadge').style.display = n>0?'block':'none';
}

function handleDrop(e){e.preventDefault();readExcel(e.dataTransfer.files[0]);}

function readExcel(file) {
  if (!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const sheet=wb.Sheets['RawData']||wb.Sheets[wb.SheetNames[0]];
    if (!sheet){alert("RawData 시트를 찾을 수 없습니다.");return;}
    const all=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
    const year=String(all[1]?.[0]||'2025');
    const corp=String(all[1]?.[1]||'');
    const region=String(all[1]?.[2]||'');
    const rows=[];
    for(let i=5;i<all.length;i++){
      const r=all[i];
      if(!r[0]&&r[0]!==0) continue;
      rows.push({
        seq:r[0],road:String(r[1]||''),code:String(r[2]||''),
        settle:String(r[3]||''),crack:String(r[4]||''),
        wet:String(r[5]||''),age:String(r[6]||''),history:String(r[7]||''),
        sI:r[8]!==''?r[8]:'',sJ:r[9]!==''?r[9]:'',
        sK:r[10]!==''?r[10]:'',sL:r[11]!==''?r[11]:'',
        sM:r[12]!==''?r[12]:'',sN:r[13]!==''?r[13]:'',
        grade:String(r[14]||'일반'),opinion:String(r[15]||''),
        addr:String(r[16]||'').trim(),
        infoS:String(r[18]||''),infoT:String(r[19]||''),
        lat:null,lng:null,geoOk:false,_key:'r'+i
      });
    }
    const fid='F_'+Date.now();
    files[fid]={name:file.name,year,corp,region,rows,visible:true};
    activeFileId=fid;
    renderSidebar(); renderTable(); renderMobileFileList();
    rows.forEach((_,idx)=>geoQ.push({fid,rowIdx:idx}));
    updateGBadge();
    if(kakaoReady&&!geoRunning) runGeoQueue();
  };
  reader.readAsArrayBuffer(file);
}

   마커 관리
══════════════════════════════════════════════════ */
function placeMarker(fid,key,row){
  if(!map||!row.geoOk||row.lat===null) return;
  const mk=`${fid}:${key}`;
  if(markerMap.has(mk)){
    markerMap.get(mk).setPosition(new kakao.maps.LatLng(row.lat,row.lng));
    return;
  }
  const gc=row.grade==='긴급'?'urg':row.grade==='우선'?'pri':'gen';
  const wrap=document.createElement('div');
  wrap.className='mw'; wrap.style.position='relative';
  const dot=document.createElement('div');
  dot.className=`mc ${gc}`; dot.textContent=row.seq;
  const tip=document.createElement('div');
  tip.className='mt';
  tip.innerHTML=`<b style="color:var(--acc)">${row.code||'-'}</b>
    <span style="color:#9ca3af;font-size:10px"> ${row.grade}</span><br>
    <span style="color:#d1d5db">${row.infoS||''}</span><br>
    <small style="color:#6b7280">${row.addr||'주소없음'}</small>`;
  wrap.appendChild(dot); wrap.appendChild(tip);
  dot.onmouseenter=()=>tip.style.display='block';
  dot.onmouseleave=()=>tip.style.display='none';
  dot.ontouchstart=()=>{
    tip.style.display=tip.style.display==='block'?'none':'block';
  };
  dot.onclick=()=>{
    const tr=document.getElementById('tr_'+CSS.escape(mk));
    if(tr){
      // 모바일: 데이터 탭으로 전환 후 스크롤
      if(window.innerWidth<768) switchTab(2);
      setTimeout(()=>{
        tr.scrollIntoView({block:'center',behavior:'smooth'});
        tr.classList.add('hl');
        setTimeout(()=>tr.classList.remove('hl'),1500);
      },100);
    }
  };
  const ov=new kakao.maps.CustomOverlay({
    position:new kakao.maps.LatLng(row.lat,row.lng),
    content:wrap, zIndex:gc==='urg'?3:gc==='pri'?2:1
  });
  ov.setMap(map);
  markerMap.set(mk,ov);
}

function setFileVisible(fid,visible){
  const f=files[fid]; if(!f) return;
  f.visible=visible;
  f.rows.forEach(row=>{
    const mk=`${fid}:${row._key}`;
    if(markerMap.has(mk)) markerMap.get(mk).setMap(visible?map:null);
  });
}

function updateQCell(fid,key,ok){
  const mk=`${fid}:${key}`;
  const inp=document.querySelector(`#tr_${CSS.escape(mk)} .qInp`);
  if(!inp) return;
  inp.classList.remove('qa','qf','qw');
  inp.classList.add(ok?'qa':'qf');
  inp.title=ok?'':'⚠ 주소 변환 실패';
}

async function moveMarker(fid,key,row){
  if(!row.addr) return;
  const res=await geocodeAddr(row.addr);
  if(res){
    row.lat=res.lat; row.lng=res.lng; row.geoOk=true;
    updateQCell(fid,key,true);
    placeMarker(fid,key,row);
    if(map) map.panTo(new kakao.maps.LatLng(row.lat,row.lng));
  } else {
    row.geoOk=false;
    updateQCell(fid,key,false);
  }
}

function focusResult(lat,lng,name,addr){
  document.getElementById('sRes').style.display='none';

  if(window.innerWidth<768) switchTab(0);

  if(srchOv){srchOv.setMap(null);srchOv=null;}
  if(srchCi){srchCi.setMap(null);srchCi=null;}

    center:pos,radius:30,strokeWeight:2,strokeColor:'#ff00cc',
    strokeOpacity:.9,strokeStyle:'solid',fillColor:'#ff00cc',fillOpacity:.13
  });
  srchCi.setMap(map);
  srchOv=new kakao.maps.CustomOverlay({
    position:pos,
    content:`<div onclick="clearSearch()" style="
      background:rgba(200,0,180,.92);color:#fff;padding:6px 12px;border-radius:6px;
      font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5);

function renderTable(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  const FIELDS=['seq','road','code','settle','crack','wet','age','history',
                'sI','sJ','sK','sL','sM','sN','grade','opinion','addr','infoS','infoT'];
  Object.entries(files).forEach(([fid,f])=>{
    if(!f.visible) return;
    f.rows.forEach(row=>{
      const mk=`${fid}:${row._key}`;
      const tr=document.createElement('tr');
      tr.id='tr_'+mk;
      FIELDS.forEach(field=>{
        const td=document.createElement('td');
        const inp=document.createElement('input');
        const isAddr=field==='addr';
        inp.className='ce'+(isAddr?' qw qInp':'');
        if(isAddr){
          if(row.geoOk) inp.classList.replace('qw','qa');
          else if(row.lat!==null) inp.classList.replace('qw','qf');
        }
        inp.value=row[field]!==null&&row[field]!==undefined?row[field]:'';
        inp.onchange=ev=>{
          row[field]=ev.target.value;
          if(field==='addr') moveMarker(fid,row._key,row);
        };
        td.appendChild(inp); tr.appendChild(td);
      });
      tr.onclick=ev=>{
        if(ev.target.tagName==='INPUT') return;
        if(map&&row.geoOk&&row.lat){
          map.panTo(new kakao.maps.LatLng(row.lat,row.lng));
          map.setLevel(3);
          if(window.innerWidth<768) switchTab(0);
        }
      };
      tbody.appendChild(tr);
    });
  });
}

function deleteFile(fid){
  if(!confirm('파일을 삭제할까요?')) return;
  const f=files[fid];
  if(f) f.rows.forEach(row=>{
    const mk=`${fid}:${row._key}`;
    if(markerMap.has(mk)){markerMap.get(mk).setMap(null);markerMap.delete(mk);}
  });
  delete files[fid];
  if(activeFileId===fid) activeFileId=null;
  renderSidebar(); renderTable(); renderMobileFileList();
}

/* ══════════════════════════════════════════════════
   Firebase Storage 업로드
══════════════════════════════════════════════════ */
async function uploadToStorage(file){
  if(!file) return;
  const prog=document.getElementById('upProg');
  prog.style.display='block';
  prog.textContent='📤 업로드 중...';
  try{
    const ref=storage.ref(`excel/${file.name}`);
    const task=ref.put(file);
    task.on('state_changed',
      snap=>{
        const p=Math.round(snap.bytesTransferred/snap.totalBytes*100);
        prog.textContent=`📤 업로드 ${p}%`;
      },
      err=>{prog.textContent=`❌ 실패: ${err.message}`;},
      async()=>{
        prog.textContent='✅ 완료! 지도 표시 중...';
        readExcel(file);
        setTimeout(()=>{prog.style.display='none';},3000);
      }
    );
  }catch(e){prog.textContent=`❌ 오류: ${e.message}`;}
}

async function listStorageFiles(){
  try{
    const ref=storage.ref('excel');
    const list=await ref.listAll();
    return list.items;
  }catch(e){return[];}
}

async function downloadAndLoad(fileRef,fileName){
  try{
    const url=await fileRef.getDownloadURL();
    const resp=await fetch(url);
    const blob=await resp.blob();
    readExcel(new File([blob],fileName,{type:blob.type}));
  }catch(e){alert('불러오기 실패: '+e.message);}
}

      infoS:r.infoS,infoT:r.infoT,lat:r.lat||null,lng:r.lng||null
    }))
  }).then(()=>alert('☁ Firebase 저장 완료!\n동료도 같은 URL에서 이 데이터를 볼 수 있습니다.'))
    .catch(e=>alert('저장 실패: '+e.message));
}

async function loadFromFB(){
  const fbList=document.getElementById('fbList');
  const mFbList=document.getElementById('mFbList');
  const setHtml=(el,h)=>{if(el)el.innerHTML=h;};
  setHtml(fbList,'<span style="color:var(--acc)">불러오는 중...</span>');
  setHtml(mFbList,'<span style="color:var(--acc)">불러오는 중...</span>');

  // Storage 파일 목록
  const storageItems=await listStorageFiles();

  db.ref('projects').once('value',snap=>{
    const data=snap.val();
    setHtml(fbList,'');
    setHtml(mFbList,'');

    const renderFBItem=(container,isMobile)=>{
      // Storage 원본 파일
      if(storageItems.length>0){
        const lbl=document.createElement('div');
        lbl.style.cssText='font-size:10px;color:#6b7280;margin:4px 0 3px';
        lbl.textContent='📁 Storage 원본 파일';
        container.appendChild(lbl);
        storageItems.forEach(item=>{
          const d=document.createElement('div');
          d.style.cssText='display:flex;align-items:center;gap:6px;padding:7px 8px;'+
            'background:var(--s2);border-radius:6px;margin-bottom:3px;cursor:pointer;'+
            'border:1px solid transparent;font-size:11px;';
          d.innerHTML=`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            📄 ${item.name}</span>
            <b style="color:var(--red);cursor:pointer;flex-shrink:0"
               onclick="event.stopPropagation();item.delete().then(()=>loadFromFB())">×</b>`;
          d.onclick=()=>downloadAndLoad(item,item.name);
          container.appendChild(d);
        });
      }
      // DB 처리 데이터
      if(data&&Object.keys(data).length>0){
        const lbl=document.createElement('div');
        lbl.style.cssText='font-size:10px;color:#6b7280;margin:6px 0 3px';
        lbl.textContent='🗄 처리된 데이터 (DB)';
        container.appendChild(lbl);
        Object.entries(data).forEach(([fid,f])=>{
          const isLoaded=!!files[fid];
          const d=document.createElement('div');
          d.style.cssText='display:flex;align-items:center;gap:6px;padding:7px 8px;'+
            'background:var(--s2);border-radius:6px;margin-bottom:3px;cursor:pointer;'+
            'border:1px solid '+(isLoaded?'var(--acc)':'transparent')+';font-size:11px;';
          d.innerHTML=`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${isLoaded?'✅':'☁'} ${f.name}</span>
            <small style="color:#6b7280;flex-shrink:0">${(f.rows||[]).length}건</small>
            <b style="color:var(--red);cursor:pointer;flex-shrink:0;margin-left:4px"
               onclick="event.stopPropagation();deleteFBProject('${fid}')">×</b>`;
          d.onclick=()=>{
            if(isLoaded){activeFileId=fid;renderSidebar();renderMobileFileList();}
            else{
              const rows=(f.rows||[]).map((r,i)=>({...r,geoOk:!!(r.lat&&r.lng),_key:'r'+i}));
              files[fid]={name:f.name,year:f.year||'',corp:f.corp||'',region:f.region||'',rows,visible:true};
              activeFileId=fid;
              renderSidebar();renderTable();renderMobileFileList();
              rows.forEach(row=>{if(row.geoOk&&files[fid].visible)placeMarker(fid,row._key,row);});
              loadFromFB();
            }
          };
          container.appendChild(d);
        });
      } else if(storageItems.length===0){
        const empty=document.createElement('div');
        empty.style.cssText='font-size:11px;color:#6b7280;text-align:center;padding:6px';
        empty.textContent='저장된 파일 없음';
        container.appendChild(empty);
      }
    };

    if(fbList)   renderFBItem(fbList,false);
    if(mFbList)  renderFBItem(mFbList,true);
  });
}

function deleteFBProject(fid){
  if(!confirm('Firebase에서 이 파일을 삭제할까요?')) return;
  db.ref(`projects/${fid}`).remove().then(()=>{
    if(files[fid]) deleteFile(fid);
    else loadFromFB();
  });
}

function exportXlsx(){
  if(!activeFileId||!files[activeFileId]){alert("파일을 선택하세요.");return;}
  const f=files[activeFileId];
  const colH=["순번","조사측선명","손상구분번호","침하(mm)","균열","습윤","노후도(년)",
    "지반침하발생이력","침하점수","균열점수","습윤점수","노후도점수","보수보강이력",
    "평가점수","평가등급","조사자의견","인접지번주소","조사위치도","부가정보1","부가정보2"];
  const rows=f.rows.map(r=>[
    r.seq,r.road,r.code,r.settle,r.crack,r.wet,r.age,r.history,
    r.sI,r.sJ,r.sK,r.sL,r.sM,r.sN,r.grade,r.opinion,r.addr,'',r.infoS,r.infoT
  ]);
  const ws=XLSX.utils.aoa_to_sheet([
    ["시행년도","시행사 구분","권역구 구분"],[f.year,f.corp,f.region],[],colH,...rows
  ]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'RawData');
  XLSX.writeFile(wb,`지하안전_갱신_${f.name}`);
}
